name: Calibration and ResearchOS checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install .
      - run: python -m unittest discover -s tests -v
      - run: python tests/check_installed.py
      - run: mkdir runs
      - run: uncertainty-calibration analyze examples/binary.json --output runs/synthetic
      - run: uncertainty-calibration verify runs/synthetic
      - uses: actions/upload-artifact@v4
        with:
          name: synthetic-calibration-${{ matrix.python }}
          path: runs/synthetic
          retention-days: 7
