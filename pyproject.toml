[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "truthai-uncertainty-calibration"
version = "0.1.0"
description = "Offline binary calibration evaluation and ResearchOS evidence replay"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}

[project.scripts]
uncertainty-calibration = "uncertainty_calibration.__main__:main"

[tool.setuptools.packages.find]
include = ["uncertainty_calibration*"]
